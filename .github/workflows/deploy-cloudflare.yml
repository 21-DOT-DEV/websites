name: Deploy to Cloudflare Pages

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the build artifact to deploy'
        required: true
        type: string
      project-name:
        description: 'Cloudflare Pages project name'
        required: true
        type: string
      deploy-to-production:
        description: 'Deploy to production (true) or preview (false)'
        required: true
        type: boolean
      artifact-path:
        description: 'Path where artifact should be extracted'
        required: false
        type: string
        default: 'Websites'
    secrets:
      # Not `required: true`: untrusted PRs reach this workflow with empty
      # secret values and the deploy job self-skips; a genuinely missing
      # token on a trusted run fails loudly in the preflight step instead.
      cloudflare-api-token:
        required: false
      cloudflare-account-id:
        required: false
      cloudflare-zone-id:
        description: 'Cloudflare zone ID (21.dev) for edge cache purge on production deploys'
        required: false
      google-service-account-json:
        required: false
    outputs:
      deployment-url:
        description: 'The URL where the site was deployed'
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    # Deploy only on trusted events: push, manual dispatch, or a pull_request
    # that can actually hold secrets. Dependabot- and fork-authored PRs get
    # no repository secrets and a read-only GITHUB_TOKEN (GitHub treats them
    # like forks), so the wrangler deploy and PR comment can never succeed —
    # skip rather than fail. Author login is used instead of github.actor,
    # which Dependabot commands can influence. Events are whitelisted so a
    # future pull_request_target caller (which WOULD see secrets on fork
    # code) can't silently widen the deploy surface.
    # Keep this condition in exact inverse sync with deploy-skip-notice's
    # gate at the bottom of this file — review any change to one in the other.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    env:
      DEPLOYMENT_BRANCH: preview
      DEVELOPER_DIR: "/Applications/Xcode_26.4.app/Contents/Developer"
    permissions:
      actions: read
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    
    steps:
      - name: "Preflight: verify deploy secrets are configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured for this run — deploy cannot proceed"
            exit 1
          fi
          echo "✅ Cloudflare credentials present"
      
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Determine deployment branch
        run: |
          if [[ ${{ inputs.deploy-to-production }} == true ]]; then
            echo "DEPLOYMENT_BRANCH=main" >> $GITHUB_ENV
            echo "🚀 Deploying to PRODUCTION (main branch)"
          else
            echo "DEPLOYMENT_BRANCH=preview" >> $GITHUB_ENV
            echo "🔍 Deploying to PREVIEW"
          fi
      
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}/${{ inputs.project-name }}
      
      - name: Extract artifact if zipped
        run: |
          deploy_dir="${{ inputs.artifact-path }}/${{ inputs.project-name }}"
          
          # Check if artifact is a zip file (docs workflow)
          if [ -f "${deploy_dir}/${{ inputs.project-name }}.zip" ]; then
            echo "📦 Extracting documentation archive..."
            unzip -q "${deploy_dir}/${{ inputs.project-name }}.zip" -d "${deploy_dir}"
            rm "${deploy_dir}/${{ inputs.project-name }}.zip"
            echo "✅ Documentation extracted and ready for deployment"
          fi
      
      - name: Install wrangler
        # Exact pin — this job holds the Cloudflare deploy token, so the
        # CLI is pinned like the actions are. Bump deliberately via PR.
        run: npm install -g wrangler@3.114.17
      
      - name: Copy Functions to repo root
        run: |
          functions_src="Resources/${{ inputs.project-name }}/functions"
          
          if [ ! -d "$functions_src" ]; then
            echo "❌ Error: Functions directory not found: $functions_src"
            exit 1
          fi
          
          # Wrangler expects functions/ as a sibling of the deploy directory
          cp -R "$functions_src" ./functions
          echo "✅ Copied $functions_src → ./functions/"
          
          if [ ! -f "./functions/_middleware.ts" ]; then
            echo "❌ Error: _middleware.ts not found in ./functions/"
            exit 1
          fi
          echo "✅ _middleware.ts present"
          
          if grep -q './logic.js' "./functions/_middleware.ts"; then
            if [ ! -f "./functions/logic.js" ]; then
              echo "❌ Error: _middleware.ts imports ./logic.js but file not found in ./functions/"
              exit 1
            fi
            echo "✅ logic.js present (imported by _middleware.ts)"
          fi
      
      - name: Deploy to Cloudflare Pages
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
        run: |
          deploy_output=$(wrangler pages deploy \
            "${{ inputs.artifact-path }}/${{ inputs.project-name }}" \
            --project-name="${{ inputs.project-name }}" \
            --branch="${{ env.DEPLOYMENT_BRANCH }}" \
            2>&1)
          echo "$deploy_output"
          
          deployment_url=$(echo "$deploy_output" | grep -oE 'https://[a-zA-Z0-9._-]+\.pages\.dev' | head -1)
          if [ -z "$deployment_url" ]; then
            echo "::error::Failed to extract deployment URL from wrangler output"
            exit 1
          fi
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"
      
      - name: Update deployment comment on PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          swift run util comment \
            --pr ${{ github.event.pull_request.number }} \
            --project ${{ inputs.project-name }} \
            --status ${{ steps.cloudflare.outcome == 'success' && 'success' || 'failure' }} \
            --preview-url "${{ steps.cloudflare.outputs.deployment-url }}" \
            --alias-url "https://preview.${{ inputs.project-name }}.pages.dev" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
      - name: Deployment complete
        run: |
          echo "✅ Deployment successful!"
          echo "📍 Deployment URL: ${{ steps.cloudflare.outputs.deployment-url }}"
          echo "🌿 Branch: ${{ env.DEPLOYMENT_BRANCH }}"
      
      - name: Verify redirects (docs.21.dev)
        if: inputs.deploy-to-production == false && inputs.project-name == 'docs-21-dev'
        run: |
          PREVIEW_URL="${{ steps.cloudflare.outputs.deployment-url }}"
          echo "🔍 Verifying redirects on preview: $PREVIEW_URL"
          
          # Test root redirect
          status=$(curl -sI -o /dev/null -w "%{http_code}" "${PREVIEW_URL}/")
          if [ "$status" != "301" ]; then
            echo "❌ ERROR: / expected 301, got $status"
            exit 1
          fi
          echo "✅ / → 301"
          
          # Test /p256k redirect
          status=$(curl -sI -o /dev/null -w "%{http_code}" "${PREVIEW_URL}/p256k")
          if [ "$status" != "301" ]; then
            echo "❌ ERROR: /p256k expected 301, got $status"
            exit 1
          fi
          echo "✅ /p256k → 301"
          
          echo "✓ All docs.21.dev redirects verified on preview"
      
      - name: Verify redirects (21.dev)
        if: inputs.deploy-to-production == false && inputs.project-name == '21-dev'
        run: |
          PREVIEW_URL="${{ steps.cloudflare.outputs.deployment-url }}"
          echo "🔍 Verifying redirects on preview: $PREVIEW_URL"
          
          # Test /docs redirect
          status=$(curl -sI -o /dev/null -w "%{http_code}" "${PREVIEW_URL}/docs")
          if [ "$status" != "301" ]; then
            echo "❌ ERROR: /docs expected 301, got $status"
            exit 1
          fi
          echo "✅ /docs → 301"
          
          # Test /api redirect
          status=$(curl -sI -o /dev/null -w "%{http_code}" "${PREVIEW_URL}/api")
          if [ "$status" != "301" ]; then
            echo "❌ ERROR: /api expected 301, got $status"
            exit 1
          fi
          echo "✅ /api → 301"
          
          echo "✓ All 21.dev redirects verified on preview"
      
      - name: Verify ETag + 304 revalidation
        if: inputs.deploy-to-production == false
        run: |
          PREVIEW_URL="${{ steps.cloudflare.outputs.deployment-url }}"
          TEST_PATH="/sitemap.xml"
          
          # We probe /sitemap.xml because it is the most stable per-site
          # endpoint that genuinely emits an ETag:
          #   - Both sites generate one at build time, deploy it as a static
          #     asset, and Cloudflare Pages auto-emits a strong ETag for
          #     cacheable non-HTML 200s.
          #   - CF natively handles If-None-Match → 304 for its own ETags
          #     (verified against production 21.dev / docs.21.dev).
          #
          # We deliberately do NOT probe HTML pages here. CF Pages does not
          # auto-emit ETags for HTML on Pages projects that have a
          # `_middleware.ts` file — our production probe confirmed every
          # `text/html` response ships without an `ETag` header on both sites.
          # The docs markdown content-negotiation ETag (Accept: text/markdown
          # → middleware-emitted weak ETag) is covered by JSContext unit
          # tests in Tests/MiddlewareTests/ and is too dependent on the .md
          # alternate files being present in the deployed asset tree to be a
          # reliable preview-deploy gate.
          
          echo "🔍 Verifying ETag round-trip on ${PREVIEW_URL}${TEST_PATH}"
          
          # Step 1: confirm ETag is present on the 200 response
          headers=$(curl -sI "${PREVIEW_URL}${TEST_PATH}")
          etag=$(echo "$headers" | awk 'BEGIN{IGNORECASE=1} /^etag:/ {sub(/^etag:[[:space:]]*/, "", $0); print}' | tr -d '\r\n')
          
          if [ -z "$etag" ]; then
            echo "❌ ERROR: ETag header missing on ${TEST_PATH}"
            echo "--- response headers ---"
            echo "$headers"
            exit 1
          fi
          echo "✅ ETag present: $etag"
          
          # Step 2: matching If-None-Match → 304
          code304=$(curl -sI -o /dev/null -w "%{http_code}" \
            -H "If-None-Match: $etag" \
            "${PREVIEW_URL}${TEST_PATH}")
          if [ "$code304" != "304" ]; then
            echo "❌ ERROR: matching If-None-Match expected 304, got $code304"
            exit 1
          fi
          echo "✅ matching If-None-Match → 304 Not Modified"
          
          # Step 3: bogus If-None-Match → 200 (sanity check that the 304
          # above was caused by the etag actually matching, not by always-304
          # behavior somewhere in the stack)
          code200=$(curl -sI -o /dev/null -w "%{http_code}" \
            -H 'If-None-Match: "deliberately-wrong-hash-value"' \
            "${PREVIEW_URL}${TEST_PATH}")
          if [ "$code200" != "200" ]; then
            echo "❌ ERROR: bogus If-None-Match expected 200, got $code200"
            exit 1
          fi
          echo "✅ bogus If-None-Match → 200 OK"
      
      - name: Purge Cloudflare cache (production only)
        if: inputs.deploy-to-production == true
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.cloudflare-zone-id }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "⚠️  CLOUDFLARE_ZONE_ID secret not set; skipping cache purge"
            echo "   Add the secret to enable automatic edge cache invalidation on production deploys"
            exit 0
          fi

          echo "🧹 Purging Cloudflare edge cache for zone $CLOUDFLARE_ZONE_ID..."
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          success=$(echo "$response" | jq -r '.success')
          if [ "$success" = "true" ]; then
            echo "✅ Cache purge successful"
          else
            echo "❌ Cache purge failed"
            echo "$response" | jq .
            exit 1
          fi
      
      - name: Submit sitemap to Google Search Console
        if: inputs.deploy-to-production == true
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.google-service-account-json }}
        run: swift run util search-console submit --site ${{ inputs.project-name }} --verbose

  deploy-skip-notice:
    name: Preview deploy skipped (untrusted PR)
    # Inverse of the deploy job's pull_request gate above — keep the two in
    # sync: any change to one's trusted-PR test must be mirrored in the
    # other. Runs only on Dependabot- or fork-authored PRs to document why
    # the deploy check shows skipped.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record skip reason
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          {
            echo "## Preview deploy skipped — by design"
            echo ""
            echo "**PR author:** \`${PR_AUTHOR}\` · **Head repo:** \`${HEAD_REPO}\`"
            echo ""
            echo "GitHub gives Dependabot- and fork-authored pull requests a read-only"
            echo "token and no repository secrets, so the Cloudflare deploy and preview"
            echo "comment can never succeed on this PR. The build/test/documentation"
            echo "jobs are the coverage for this change."
            echo ""
            echo "Trusted pull requests (same-repo, non-Dependabot) still get preview"
            echo "deploys; pushes to \`main\` deploy to production as usual."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Preview deploy skipped::Untrusted PRs receive no repository secrets — Cloudflare deploy skipped by design (see job summary)."
